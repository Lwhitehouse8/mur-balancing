name: Add reading from issue

on:
  issues:
    types: [opened]

concurrency:
  group: readings
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Reading')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      ok: ${{ steps.add.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: add
        env:
          BODY: ${{ github.event.issue.body }}
          CREATED: ${{ github.event.issue.created_at }}
        run: python3 .github/scripts/add_reading.py
      - if: steps.add.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings.csv
          git commit -m "Add reading from #${{ github.event.issue.number }}"
          git push
      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.add.outputs.msg || 'Something went wrong adding this reading. Check the Actions tab.' }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "$MSG"

  deploy:
    needs: add
    if: needs.add.outputs.ok == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
